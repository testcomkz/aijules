<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - AnyPost</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-layout">
    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="logo">AnyPost</a>
            <h1 class="auth-title">Создание аккаунта</h1>
        </div>
        <form class="auth-form">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
        </form>
        <div class="auth-footer">
            <p>Уже есть аккаунт? <a href="login.html">Войдите</a></p>
        </div>
    </div>
</body>
</html>
