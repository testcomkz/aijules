    <!-- Mobile Bottom Navigation -->

        <a href="feed.html" class="nav-link" title="Лента">

    <main class="main-content">
        <div class="container create-post-container">
            <h1 class="section-title" style="text-align: center; margin-bottom: 30px;">Создание нового поста</h1>
            <div class="create-post-form-wrapper">
                <form class="create-post-form">
                    <div class="form-group">
                        <label for="post-text">Текст вашего поста</label>
                        <textarea id="post-text" class="form-control" rows="6" placeholder="Что у вас нового?"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Добавить медиа</label>
                        <div class="media-upload-buttons">
                            <button type="button" class="btn btn-secondary">Загрузить фото</button>
                            <button type="button" class="btn btn-secondary">Загрузить видео</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="post-tags">Теги (через запятую)</label>
                        <input type="text" id="post-tags" class="form-control" placeholder="#природа, #путешествия...">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Опубликовать</button>
                        <button type="button" class="btn btn-secondary">Предпросмотр</button>
                    </div>
                </form>
                <div class="post-preview-section">
                    <h2 class="preview-title">Предпросмотр</h2>
                    <article class="post-card">
                        <header class="post-header">
                            <div class="post-author">
                                <div class="author-avatar-placeholder"></div>
                                <div class="author-info">
                                    <a href="#" class="author-name">ВашеИмя</a>
                                    <span class="post-date">только что</span>
                                </div>
                            </div>
                            <button class="post-options-btn" aria-label="Дополнительные действия">•••</button>
                        </header>
                        <div class="post-content">
                            <p class="post-text">Текст вашего поста появится здесь...</p>
                            <div class="post-media-placeholder">
                                <span>Ваше фото или видео</span>
                            </div>
                        </div>
                        <footer class="post-footer">
                            <div class="post-tags">
                                <a href="#" class="tag">#ваши_теги</a>
                            </div>
                            <div class="post-actions">
                                <button class="action-btn like">Лайк</button>
                                <button class="action-btn save">Сохранить</button>
                                <button class="action-btn share">Поделиться</button>
                            </div>
                        </footer>
                    </article>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
