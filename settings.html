<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - AnyPost</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

    <!-- Desktop Header -->
    <header class="main-header">
        <div class="container header-container">
            <a href="index.html" class="logo">AnyPost</a>
            <div class="desktop-search">
                <input type="text" class="search-input" placeholder="Поиск по тегам...">
            </div>
            <nav class="main-nav">
                <a href="feed.html" class="nav-link" title="Лента"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h7.5" /></svg></a>
                <a href="search.html" class="nav-link" title="Поиск"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg></a>
                <a href="create.html" class="nav-link" title="Создать пост"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg></a>
                <a href="#" class="nav-link" title="Сохраненное"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.5 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" /></svg></a>
                <a href="profile.html" class="nav-link" title="Профиль"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg></a>
            </nav>
        </div>
    </header>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav"><!-- Mobile nav content --></nav>

    <main class="main-content">
        <div class="container settings-container">
            <h1 class="section-title">Настройки</h1>
            <form class="settings-form">
                <section class="settings-section">
                    <h2 class="settings-section-title">Профиль</h2>
                    <div class="form-group">
                        <label for="name">Имя</label>
                        <input type="text" id="name" class="form-control" value="Имя Фамилия">
                    </div>
                    <div class="form-group">
                        <label for="username">Имя пользователя</label>
                        <input type="text" id="username" class="form-control" value="ИмяПользователя">
                    </div>
                    <div class="form-group">
                        <label for="bio">Описание профиля</label>
                        <textarea id="bio" class="form-control" rows="4"></textarea>
                    </div>
                </section>

                <section class="settings-section">
                    <h2 class="settings-section-title">Безопасность</h2>
                    <div class="form-group">
                        <label for="current-password">Текущий пароль</label>
                        <input type="password" id="current-password" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="new-password">Новый пароль</label>
                        <input type="password" id="new-password" class="form-control">
                    </div>
                </section>

                <section class="settings-section">
                    <h2 class="settings-section-title">Прочее</h2>
                    <div class="form-group">
                        <label for="language">Язык</label>
                        <select id="language" class="form-control">
                            <option>Русский</option>
                            <option>English</option>
                        </select>
                    </div>
                    <div class="form-group form-group-toggle">
                        <label for="privacy">Приватный профиль</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="privacy">
                            <span class="slider"></span>
                        </label>
                    </div>
                </section>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
